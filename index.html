<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आमदार माऊली आबा कटके</title>

  <link
    href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 44px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.05),
        0 2px 6px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(230, 230, 230, 0.7);
    }

    .profile-img-container {
      width: 112px;
      height: 112px;
      margin: 0 auto 24px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(
        45deg,
        #f09433 0%,
        #e6683c 25%,
        #dc2743 50%,
        #cc2366 75%,
        #bc1888 100%
      );
      box-shadow: 0 4px 14px rgba(220, 39, 67, 0.2);
    }

    .profile-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background-color: #fff;
    }

    .header-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.35;
      letter-spacing: -0.2px;
    }

    .gradient-text {
      background: linear-gradient(
        135deg,
        #e05252 0%,
        #b83280 50%,
        #6b21a8 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      display: inline-block;
    }

    .subtitle {
      color: #737373;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .highlight-text {
      font-weight: 700;
      color: #262626;
      display: inline-block;
      margin-top: 8px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border-radius: 50px;
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
      letter-spacing: 0.2px;
    }

    .btn-haveli {
      background: linear-gradient(
        135deg,
        #7b2cbf 0%,
        #5a189a 100%
      );
      box-shadow: 0 6px 18px rgba(123, 44, 191, 0.25);
    }

    .btn-haveli:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(123, 44, 191, 0.35);
      background: linear-gradient(
        135deg,
        #8a3ab9 0%,
        #631ba6 100%
      );
    }

    .btn-shirur {
      background: linear-gradient(
        135deg,
        #f09433 0%,
        #e6683c 50%,
        #dc2743 100%
      );
      box-shadow: 0 6px 18px rgba(220, 39, 67, 0.25);
    }

    .btn-shirur:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(220, 39, 67, 0.35);
      filter: brightness(1.05);
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* WhatsApp + Telegram */

    .contact-widgets {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 9998;
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    .contact-widget {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.22);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .contact-widget:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .contact-widget svg {
      width: 27px;
      height: 27px;
      fill: #ffffff;
    }

    .whatsapp-widget {
      background: #25D366;
    }

    .telegram-widget {
      background: #229ED9;
    }

    /* n8n chat colour */

    :root {
      --chat--color-primary: #6b21a8;
      --chat--color-primary-shade-50: #5a189a;
      --chat--color-primary-shade-100: #4c1680;
    }

    /* Hide branding */

    .n8n-chat .chat-powered-by {
      display: none !important;
    }

    @media (max-width: 600px) {

      .card {
        padding: 38px 24px;
      }

      .header-title {
        font-size: 24px;
      }

      .contact-widgets {
        left: 14px;
        bottom: 14px;
        gap: 8px;
      }

      .contact-widget {
        width: 46px;
        height: 46px;
      }

      .contact-widget svg {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>

<body>
