<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आमदार माऊली आबा कटके</title>

  <link
    href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FFF5F7 0%, #fdfbfb 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 44px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 12px 32px rgba(255, 51, 102, 0.08),
        0 2px 6px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 228, 233, 0.7);
    }

    .profile-img-container {
      width: 112px;
      height: 112px;
      margin: 0 auto 24px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(
        45deg,
        #FF3366 0%,
        #7C3AED 100%
      );
      box-shadow: 0 4px 14px rgba(255, 51, 102, 0.25);
    }

    .profile-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background-color: #fff;
    }

    .header-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.35;
      letter-spacing: -0.2px;
    }

    .gradient-text {
      background: linear-gradient(
        135deg,
        #FF3366 0%,
        #7C3AED 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      display: inline-block;
    }

    .subtitle {
      color: #64748B;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .highlight-text {
      font-weight: 700;
      color: #1E1B4B;
      display: inline-block;
      margin-top: 8px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border-radius: 50px;
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
      letter-spacing: 0.2px;
    }

    .btn-haveli {

      background: linear-gradient(

        135deg,

        #7b2cbf 0%,

        #5a189a 100%

      );

      box-shadow: 0 6px 18px rgba(123, 44, 191, 0.25);

    }



    .btn-haveli:hover {

      transform: translateY(-2px);

      box-shadow: 0 8px 22px rgba(123, 44, 191, 0.35);

      background: linear-gradient(

        135deg,

        #8a3ab9 0%,

        #631ba6 100%

      );

    }



    .btn-shirur {

      background: linear-gradient(

        135deg,

        #f09433 0%,

        #e6683c 50%,

        #dc2743 100%

      );

      box-shadow: 0 6px 18px rgba(220, 39, 67, 0.25);

    }



    .btn-shirur:hover {

      transform: translateY(-2px);

      box-shadow: 0 8px 22px rgba(220, 39, 67, 0.35);

      filter: brightness(1.05);

    }



    .btn:active {

      transform: scale(0.97);

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);

    }
    /* WhatsApp + Telegram */
    .contact-widgets {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 9998;
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    .contact-widget {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .contact-widget:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .contact-widget svg {
      width: 27px;
      height: 27px;
      fill: #ffffff;
    }

    .whatsapp-widget {
      background: #25D366;
    }

    .telegram-widget {
      background: #229ED9;
    }

    /* --- Chat Glow Animation & Floating Label --- */
    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.6), 0 12px 30px rgba(255, 51, 102, 0.4);
      }
      70% {
        box-shadow: 0 0 0 20px rgba(255, 51, 102, 0), 0 12px 30px rgba(255, 51, 102, 0.4);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 51, 102, 0), 0 12px 30px rgba(255, 51, 102, 0.4);
      }
    }

    /* Target the n8n chat toggle button to apply the glow */
    .n8n-chat .chat-toggle, 
    chat-toggle, 
    button.chat-toggle {
      animation: pulse-glow 2s infinite cubic-bezier(0.4, 0, 0.6, 1) !important;
    }

    /* Floating callout label wrapper positioned right above the chat button */
    .chat-attention-badge {
      position: fixed;
      right: 25px;
      bottom: 100px;
      z-index: 9999;
      background: linear-gradient(135deg, #FF3366 0%, #7C3AED 100%);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
      letter-spacing: 0.3px;
      animation: bounce-label 2s infinite ease-in-out;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes bounce-label {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    
    :root {
      --chat--color--primary: #FF3366;
      --chat--color--primary-shade-50: #E61E53;
      --chat--color--primary--shade-100: #CC0044;
      --chat--color--secondary: #7C3AED;
      --chat--color-secondary-shade-50: #6D28D9;
      --chat--color-white: #ffffff;
      --chat--color-light: #FFF5F7;
      --chat--color-light-shade-50: #FFE4E9;
      --chat--color-light-shade-100: #FCD5DC;
      --chat--color-medium: #E2E8F0;
      --chat--color-dark: #1E1B4B;
      --chat--color-disabled: #CBD5E1;
      --chat--color-typing: #64748B;

      --chat--spacing: 1rem;
      --chat--border-radius: 1.5rem;
      --chat--transition-duration: 0.3s;
      --chat--font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --chat--window--width: 420px;
      --chat--window--height: 640px;
      --chat--window--bottom: 1.5rem;
      --chat--window--right: 1.5rem;
      --chat--window--z-index: 10000;
      --chat--window--border: 1px solid rgba(255, 51, 102, 0.1);
      --chat--window--border-radius: 2rem;
      --chat--window--margin-bottom: var(--chat--spacing);
      box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.25), 0 0 0 1px rgba(255, 51, 102, 0.1);

      --chat--header-height: auto;
      --chat--header--padding: 1.75rem 1.5rem;
      --chat--header--background: linear-gradient(135deg, #FF3366 0%, #7C3AED 100%);
      --chat--header--color: #ffffff;
      --chat--heading--font-size: 1.6em;
      --chat--subtitle--font-size: 0.95rem;
      --chat--subtitle--line-height: 1.6;

      --chat--message--font-size: 1.05rem;
      --chat--message--padding: 1.25rem 1.5rem;
      --chat--message--border-radius: 1.5rem;
      --chat--message-line-height: 1.6;
      --chat--message--margin-bottom: 1rem;
      
      --chat--message--bot--background: #ffffff;
      --chat--message--bot--color: #1E1B4B; 
      --chat--message--bot--border: 1px solid #FCD5DC;
      
      --chat--message--user--background: #FFE4E9;
      --chat--message--user--color: #1E1B4B;
      --chat--message--user--border: 1px solid #FF3366;
      
      --chat--message--pre--background: rgba(255, 51, 102, 0.05);
      --chat--messages-list--padding: 2rem;

      --chat--toggle--size: 72px;
      --chat--toggle--width: var(--chat--toggle--size);
      --chat--toggle--height: var(--chat--toggle--size);
      --chat--toggle--border-radius: 50%;
      --chat--toggle--background: linear-gradient(135deg, #FF3366 0%, #7C3AED 100%);
      --chat--toggle--hover--background: linear-gradient(135deg, #E61E53 0%, #6D28D9 100%);
      --chat--toggle--active--background: #CC0044;
      --chat--toggle--color: var(--chat--color-white);

      --chat--textarea--height: 56px;
      --chat--textarea--max-height: 25rem;
      --chat--input--font-size: 1rem;
      --chat--input--border: 2px solid #FFE4E9;
      --chat--input--border-radius: 9999px;
      --chat--input--padding: 1rem 1.4rem;
      --chat--input--background: #ffffff;
      --chat--input--text-color: #1E1B4B;
      --chat--input--line-height: 1.5;
      --chat--input--placeholder--font-size: 1rem;
      --chat--input--border-active: 2px solid #FF3366;

      --chat--body--background: #FFF5F7;
      --chat--footer--background: #ffffff;
      --chat--footer--color: #1E1B4B;
    }

    /* Custom Chat Layout & Overrides */
    .chat-messages-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .chat-message.bot {
      align-self: flex-start;
      max-width: 75%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .chat-message.user {
      align-self: flex-end;
      max-width: 75%;
      color: #1E1B4B !important;
    }

    .chat-footer {
      padding: 1.2rem 1.5rem;
      border-top: 2px solid #FFE4E9;
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
    }

    /* Hide branding */
    .n8n-chat .chat-powered-by {
      display: none !important;
    }

    @media (max-width: 600px) {
      .card {
        padding: 38px 24px;
      }

      .header-title {
        font-size: 24px;
      }

      .contact-widgets {
        left: 14px;
        bottom: 14px;
        gap: 8px;
      }

      .contact-widget {
        width: 46px;
        height: 46px;
      }

      .contact-widget svg {
        width: 24px;
        height: 24px;
      }

      .chat-attention-badge {
        right: 15px;
        bottom: 95px;
        font-size: 13px;
        padding: 6px 14px;
      }
    }
  </style>
</head>
