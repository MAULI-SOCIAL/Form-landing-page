<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>माउली आबा कटके जनसंपर्क कार्यालय</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      /* Soft Instagram-inspired background gradient */
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 44px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      /* Soft Instagram floating shadow */
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(230, 230, 230, 0.7);
    }
    /* Instagram Story Style Profile Ring */
    .profile-img-container {
      width: 112px;
      height: 112px;
      margin: 0 auto 24px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 4px 14px rgba(220, 39, 67, 0.2);
    }
    .profile-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background-color: #fff;
    }
    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.35;
      letter-spacing: -0.2px;
    }
    .title-red {
      color: #e64c5d;
    }
    .title-purple {
      color: #5e35b1;
    }
    .subtitle {
      color: #737373;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }
    .highlight-text {
      font-weight: 700;
      color: #262626;
      display: inline-block;
      margin-top: 8px;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    /* Aesthetic Instagram-style Pill Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border-radius: 50px; /* Modern rounded pill style */
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
      letter-spacing: 0.2px;
    }

    /* Haveli Button - Velvet Royal Gradient */
    .btn-haveli {
      background: linear-gradient(135deg, #7b2cbf 0%, #5a189a 100%);
      box-shadow: 0 6px 18px rgba(123, 44, 191, 0.25);
    }
    .btn-haveli:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(123, 44, 191, 0.35);
      background: linear-gradient(135deg, #8a3ab9 0%, #631ba6 100%);
    }

    /* Shirur Button - Instagram Sunset Coral Gradient */
    .btn-shirur {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 50%, #dc2743 100%);
      box-shadow: 0 6px 18px rgba(220, 39, 67, 0.25);
    }
    .btn-shirur:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(220, 39, 67, 0.35);
      filter: brightness(1.05);
    }

    /* Smooth Press Effect for Mobile Devices */
    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="profile-img-container">
      <img src="DKKKK.jpg" alt="माउली आबा कटके">
    </div>

    <h1 class="header-title">
      <span class="title-red">माउली आबा कटके</span> <span class="title-purple">जनसंपर्क कार्यालय</span>
    </h1>

    <p class="subtitle">
      तुमच्या समस्या आमच्यापर्यंत पोहोचवा आणि आम्ही त्या लवकरात लवकर सोडवण्याचा प्रयत्न करू. 
      <br>
      <strong class="highlight-text">तुमचा तालुका निवडा:</strong>
    </p>
    
    <div class="btn-container">
      <a href="https://mauli.westernestate.in/haveli" class="btn btn-haveli">हवेली तालुका</a>
      <a href="https://mauli.westernestate.in/shirur" class="btn btn-shirur">शिरूर तालुका</a>
    </div>
  </div>

</body>
</html>
