<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>माऊली आबा कटके जनसंपर्क कार्यालय</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 14px;
  background: linear-gradient(135deg, #eef2ff, #f8fafc);
  font-family: 'Inter', 'Open Sans', sans-serif;
  color: #0f172a;
}
.card {
  width: 100%; max-width: 500px; margin: 0 auto;
  border-radius: 18px;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 25px 50px rgba(0,0,0,.08);
  border: 1px solid #e2e8f0;
  padding: 32px;
  animation: fadeInUp .6s ease;
}
h1 {
  background: linear-gradient(90deg,#f58529,#dd2a7b,#8134af,#515bd4);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 700; font-size: 22px; line-height: 1.4;
  text-align: center; margin: 0 0 8px;
}
.intro {
  color: #334155; font-size: 14px; line-height: 1.5;
  text-align: center; margin: 0 0 24px; font-weight: 500;
}
.field { margin: 0 0 18px; }
label {
  display: block; font-weight: 600; color: #1e293b;
  margin-bottom: 8px; font-size: 14px;
}
input, textarea, select {
  display: block; width: 100%; border-radius: 12px;
  border: 1px solid #cbd5e1; padding: 12px 16px;
  font-family: inherit; font-size: 15px;
  background: #f8fafc; color: #0f172a;
  transition: all .25s ease;
}
textarea { min-height: 96px; resize: vertical; }
input:hover, textarea:hover, select:hover { border-color: #94a3b8; background: #fff; }
input:focus, textarea:focus, select:focus {
  border-color: #6366f1; background: #fff;
  box-shadow: 0 0 0 4px rgba(99,102,241,.15); outline: none;
}
input[type=file] {
  padding: 16px 12px; background: #faf5ff;
  border: 2px dashed #a855f7; border-radius: 14px;
  color: #6b21a8; font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: center;
}
input[type=file]:hover { background: #f3e8ff; border-color: #7e22ce; }
input[type=file]::file-selector-button {
  background: #9333ea; color: #fff; border: none; padding: 8px 16px;
  border-radius: 10px; font-weight: 700; margin-right: 12px; cursor: pointer;
}
button[type=submit] {
  width: 100%; height: 56px; border-radius: 14px; border: none;
  font-family: inherit; font-size: 16px; font-weight: 600;
  letter-spacing: .5px; color: #fff; cursor: pointer;
  background: linear-gradient(90deg,#4285F4,#34A853,#FBBC05,#EA4335);
  background-size: 300% 100%; transition: all .4s ease;
  box-shadow: 0 10px 25px rgba(66,133,244,.35); margin-top: 8px;
}
button[type=submit]:hover:not(:disabled) {
  background-position: 100% 0; transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(66,133,244,.45);
}
button[type=submit]:active:not(:disabled) { transform: translateY(0); box-shadow: 0 6px 14px rgba(66,133,244,.3); }
button[type=submit]:disabled { opacity: .7; cursor: default; }
.error {
  background: #fee2e2; color: #b91c1c; padding: 8px 12px;
  border-radius: 8px; margin-top: 12px; font-size: 13px;
}
.error[hidden] { display: none; }
.token { text-align: center; color: #475569; font-size: 14px; font-weight: 600; margin: 16px 0 0; }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 520px) {
  body { padding: 14px 10px; }
  .card { padding: 26px 20px; }
  h1 { font-size: 21px; }
}
</style>
</head>
<body>
<main class="card" id="card">
  <h1>माऊली आबा कटके जनसंपर्क कार्यालय</h1>
  <p class="intro">तुमच्या समस्या आमच्यापर्यंत पोहोचवा आणि आम्ही त्या लवकरात लवकर सोडवण्याचा प्रयत्न करू.</p>

  <form id="complaintForm" action="https://office.maulikatke.in/webhook/Haveli" method="POST" enctype="multipart/form-data">
    <div class="field">
      <label for="village">📍गाव [ हवेली तालुका ] <span style="color:#f04438">*</span></label>
      <select id="village" name="📍गाव   [ हवेली तालुका ]" required>
        <option value="">Select an option ...</option>
        <option>आष्टापूर</option><option>आव्हाळवाडी</option><option>उरुळी कांचन</option>
        <option>भावडी</option><option>भिवरी</option><option>भवरापूर</option>
        <option>भौरापुर</option><option>बुर्केगाव</option><option>बकोरी</option>
        <option>पिंपरीसांडस</option><option>पेरणे</option><option>प्रयागधाम</option>
        <option>फुलगाव</option><option>डोंगरगाव</option><option>तरवडे</option>
        <option>तुळापुर</option><option>टिळेकरवाडी</option><option>नायगाव</option>
        <option>नायगावपेठ</option><option>न्हावीसांडस</option><option>लोणीकंद</option>
        <option>लोणी काळभोर</option><option>वाघोली</option><option>वढू</option>
        <option>वळती</option><option>वाडेबोल्हाई</option><option>शिंदवाडी</option>
        <option>शिंदवणे</option><option>शिरसवाडी</option><option>सांगवी सांडस</option>
        <option>सोरतापवाडी</option><option>थेऊर</option><option>केसनंद</option>
        <option>कोलवडी साष्टे</option><option>कोरेगाव मुळ</option><option>खामगाव</option>
        <option>खामगाव टेक</option><option>कुंजीरवाडी</option><option>कदमवाकवस्ती</option>
        <option>म्हातोबाची आळंदी</option>
      </select>
    </div>

    <div class="field">
      <label for="name">नाव <span style="color:#f04438">*</span></label>
      <input id="name" name="नाव" type="text" placeholder="तुमचं नाव" required>
    </div>

    <div class="field">
      <label for="phone">📞 फोन नंबर <span style="color:#f04438">*</span></label>
      <input id="phone" name="📞 फोन नंबर" type="tel" inputmode="numeric"
        pattern="[0-9]{10}" maxlength="10" placeholder="तुमचा दहा अंकी मोबाईल क्रमांक" required>
    </div>

    <div class="field">
      <label for="detail">📝 तपशील / समस्या असल्यास, कृपया येथे लिहा:</label>
      <textarea id="detail" name="📝 तपशील / समस्या असल्यास, कृपया येथे लिहा:"></textarea>
    </div>

    <div class="field">
      <label for="file">📸 पुरावे/ फोटो / कागदपत्रे असल्यास येथे जोडा:</label>
      <input id="file" name="📸 पुरावे/ फोटो / कागदपत्रे असल्यास  येथे जोडा:"
        type="file" accept="image/*,.pdf,.doc,.docx" capture="environment">
    </div>

    <div class="field">
      <label for="category">आपल्याला तक्रार लिहिता येत नसल्यास, खालील पैकी निवडा</label>
      <select id="category" name="आपल्याला तक्रार लिहिता येत नसल्यास, खालील पैकी निवडा">
        <option value="">Select an option ...</option>
        <option>🏞️ पायाभूत सुविधा व नागरी समस्या</option>
        <option>- रस्ता खराब आहे / खड्डे आहेत</option>
        <option>- स्ट्रीट लाईट बंद आहे</option>
        <option>- पाण्याची पाइपलाइन गळती / पुरवठा नाही</option>
        <option>- गटार / सांडपाण्याची समस्या</option>
        <option>- सार्वजनिक शौचालयाची अडचण</option>
        <option>- कचरा उचलला जात नाही</option>
        <option>- खेळाच्या मैदानाची अडचण / सुविधा नाही</option>
        <option>- स्मशानभूमीत सुविधा नाहीत (पाणी, छप्पर, वीज)</option>
        <option>🚰 पाणी व स्वच्छता</option>
        <option>- दूषित पाणी येते</option>
        <option>- पिण्याच्या पाण्याचा अनियमित पुरवठा</option>
        <option>⚡ वीज समस्या</option>
        <option>- स्ट्रीटलाईट चालू नाही</option>
        <option>- वीज खांब पडलेला / झुकलेला</option>
        <option>- डिपी ट्रान्सफॉर्मर बिघडलेला</option>
        <option>🚌 वाहतूक व सार्वजनिक परिवहन</option>
        <option>- एसटी / बस सेवा उपलब्ध नाही / वेळेवर नाही</option>
        <option>- वाहतूक कोंडी</option>
        <option>🏥 आरोग्य सेवा</option>
        <option>- प्राथमिक आरोग्य केंद्रात औषधे नाहीत</option>
        <option>- डॉक्टर / कर्मचारी अनुपस्थित</option>
        <option>- ऍम्ब्युलन्स वेळेवर येत नाही</option>
        <option>- रुग्णालयात साफसफाई नाही</option>
        <option>🏫 शिक्षण</option>
        <option>- सरकारी शाळा बंद / अकार्यक्षम आहे</option>
        <option>- शाळेची इमारत / सुविधा खराब आहे</option>
        <option>- शिक्षक उपलब्ध नाहीत</option>
        <option>🧾 दाखले व योजना</option>
        <option>- युवकांना नोकरी/रोजगार संदर्भात मदत</option>
        <option>- जलयुक्त शिवार प्रकल्पात पाण्याच्या जलसंधारणातील अपूर्णता / कामाच्या विलंब</option>
        <option>- जल जीवन मिशन योजनेचा लाभ मिळत नाही</option>
        <option>-आपत्ती (पूर, दुष्काळ, वादळ) मदत</option>
        <option>- कौशल्य विकास/ट्रेनिंग वर्ग नाही</option>
        <option>- लाडकी बहिण’ योजनेसंबंधित अडचण</option>
        <option>- महात्मा ज्योतिबा फुले जन आरोग्य योजना: योजनेचा लाभ मिळत नाही</option>
        <option>- कर्ज माफीची अडचण</option>
        <option>🚜 शेती व ग्रामीण समस्या</option>
        <option>- पिक विमा मिळालेला नाही</option>
        <option>- प्रधानमंत्री किसान योजना पैसे जमा नाही</option>
        <option>- विहीर अनुदान रखडले आहे</option>
        <option>- जनावरांच्या शेडची योजना रखडली आहे</option>
        <option>👮 कायदा व सुव्यवस्था</option>
        <option>- स्थानिक त्रास / दहशत</option>
        <option>- चोरी / घरफोडीची/इतर तक्रार घेतली जात नाही</option>
        <option>- पोलीस सहकार्य करत नाहीत</option>
        <option>🏡 घरकुल व मालमत्ता समस्या</option>
        <option>- प्रधानमंत्री आवास योजनेचे घर रखडले आहे</option>
        <option>- जमीन वाद / मोजणी लागली आहे</option>
        <option>- ७/१२ उताऱ्यात चुका आहेत</option>
        <option>- बांधकाम परवानगी / एनओसी मिळत नाही</option>
        <option>🗣️ राजकीय व प्रशासनिक तक्रारी</option>
        <option>- शासकीय काम रखडले आहे</option>
        <option>- आमदार / सरपंच भेटत नाहीत</option>
        <option>- ग्रामपंचायतमध्ये भ्रष्टाचार</option>
        <option>- वार्ड सदस्य सहकार्य करत नाही</option>
        <option>📦 सामान्य विचारणा / मदत</option>
      </select>
    </div>

    <input type="hidden" id="latitude" name="Latitude">
    <input type="hidden" id="longitude" name="Longitude">
    <input type="hidden" id="accuracy" name="Location_Accuracy">
    <input type="hidden" id="locationLink" name="Location_Link">
    <button id="submitButton" type="submit">सादर करा</button>
    <div id="errorBox" class="error" hidden>सादर करता आले नाही. कृपया इंटरनेट तपासा आणि पुन्हा प्रयत्न करा.</div>
  </form>
</main>

<script>
const villageSelect = document.getElementById('village');
const form = document.getElementById('complaintForm');
const card = document.getElementById('card');
const button = document.getElementById('submitButton');
const errorBox = document.getElementById('errorBox');
let locationRequested = false;

function requestCitizenLocation() {
  if (locationRequested) return;
  locationRequested = true;
  if (!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(
    function (position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      document.getElementById('latitude').value = lat.toFixed(6);
      document.getElementById('longitude').value = lng.toFixed(6);
      document.getElementById('accuracy').value = String(Math.round(position.coords.accuracy));
      document.getElementById('locationLink').value =
        'https://maps.google.com/?q=' + lat.toFixed(6) + ',' + lng.toFixed(6);
    },
    function () {
      // Location is optional. The citizen can still submit the complaint.
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

// Ask for browser location permission on the citizen's first click on the village field.
villageSelect.addEventListener('pointerdown', requestCitizenLocation, { once: true });

function showSuccess(token) {
  card.innerHTML =
    '<h1>Form Submitted</h1>' +
    '<p class="intro" style="margin:0">आपली तक्रार नोंदवली आहे, धन्यवाद! लवकरच तुमच्याशी संपर्क साधला जाईल</p>';
  if (token) {
    const p = document.createElement('p');
    p.className = 'token';
    p.textContent = 'टोकन क्रमांक: ' + token;
    card.appendChild(p);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  errorBox.hidden = true;
  button.disabled = true;
  button.textContent = 'पाठवत आहे...';

  try {
    const res = await fetch(form.action, { method: 'POST', body: new FormData(form) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let data = {};
    try { data = await res.json(); } catch (_) {}
    showSuccess(data.token);
  } catch (err) {
    errorBox.hidden = false;
    button.disabled = false;
    button.textContent = 'सादर करा';
  }
});
</script>
</body>
</html>
